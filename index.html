<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Shri Sanvariya Laundry website is currently unavailable. Please check back later." />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Shri Sanvariya Laundry | Website Temporarily Unavailable</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <style>
    :root {
      --color-primary: #1e3a5f;
      --color-primary-dark: #11233b;
      --color-accent: #c9a227;
      --color-accent-light: #fdf6e3;
      --color-bg: #0b1524;
      --color-surface: rgba(30, 58, 95, 0.4);
      --color-text: #f8fafc;
      --color-text-muted: #94a3b8;
      --color-border: rgba(255, 255, 255, 0.12);
      
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Background Orbs */
    .bg-orbs {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      animation: float 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: #1e3a5f;
      top: -100px;
      left: -80px;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: #c9a227;
      bottom: -80px;
      right: -60px;
      animation-delay: -9s;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      background: #2563eb;
      top: 40%;
      left: 60%;
      opacity: 0.15;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.1); }
      100% { transform: translate(-30px, 50px) scale(0.95); }
    }

    /* Main Maintenance Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      background: var(--color-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-border);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(30, 58, 95, 0.3);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header & Brand Logo */
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      text-decoration: none;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(201, 162, 39, 0.3));
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .brand-title span {
      color: var(--color-accent);
      display: block;
      font-size: 0.85rem;
      font-family: var(--font-body);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Maintenance Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(201, 162, 39, 0.12);
      border: 1px solid rgba(201, 162, 39, 0.3);
      color: #fce788;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.825rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--color-accent);
      border-radius: 50%;
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background-color: var(--color-accent);
      opacity: 0.6;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(2.2); opacity: 0; }
    }

    /* Typography */
    .headline {
      font-family: var(--font-display);
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .message {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--color-text-muted);
      margin-bottom: 32px;
    }

    /* Icon Visual */
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-accent);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .icon-container svg {
      width: 36px;
      height: 36px;
    }

    /* Footer / Fine Print */
    .footer-note {
      font-size: 0.85rem;
      color: rgba(148, 163, 184, 0.7);
      border-top: 1px solid var(--color-border);
      padding-top: 24px;
      margin-top: 8px;
    }

    /* Mobile Tweaks */
    @media (max-width: 480px) {
      .container {
        padding: 36px 24px;
        border-radius: 22px;
      }

      .headline {
        font-size: 1.75rem;
      }

      .message {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background lighting -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="container">
    <!-- Brand Header -->
    <div class="brand">
      <img src="assets/logo.png" alt="Shri Sanvariya Laundry" class="brand-logo" />
      <div class="brand-title">
        Shri Sanvariya
        <span>Laundry</span>
      </div>
    </div>

    <!-- Status Badge -->
    <div class="status-badge">
      <span class="status-dot"></span>
      Maintenance Mode
    </div>

    <!-- Wrench / Pause Icon Visual -->
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="4" height="16" rx="1" />
        <rect x="14" y="4" width="4" height="16" rx="1" />
      </svg>
    </div>

    <!-- Required Messages -->
    <h1 class="headline">Website Temporarily Unavailable</h1>
    <p class="message">This website is currently unavailable. Please check back later.</p>

    <!-- Footer Note -->
    <div class="footer-note">
      &copy; Shri Sanvariya Laundry. All rights reserved.
    </div>
  </main>
</body>
</html>
